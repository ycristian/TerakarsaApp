<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>CCTV Live</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
body{margin:0}
a{color:#1F5FBF}a:hover{color:#17488F}
</style>
</helmet>
<div style="background: #F5F6F8; font-family: Inter, system-ui, sans-serif; color: #18212B; padding-bottom: 32px">
  <div style="background: #FFFFFF; border-bottom: 1px solid #DDE2E8; padding: 12px 24px; display: flex; flex-wrap: wrap; align-items: center; gap: 20px">
    <div style="font-size: 18px; font-weight: 700">CCTV</div>
    <nav style="display: flex; flex-wrap: wrap; gap: 4px; flex-grow: 1">
      <a href="Main.dc.html" style="padding: 12px 14px; border-radius: 8px; background: #E8F0FB; color: #17488F; font-weight: 600; font-size: 14px; text-decoration: none">Live</a>
      <a href="Playback.dc.html" style="padding: 12px 14px; border-radius: 8px; color: #3B4652; font-weight: 500; font-size: 14px; text-decoration: none">Playback</a>
      <a href="Kamera.dc.html" style="padding: 12px 14px; border-radius: 8px; color: #3B4652; font-weight: 500; font-size: 14px; text-decoration: none">Kamera</a>
    </nav>
    <div style="font-size: 13px; color: #55606C">27 kamera · <span style="color: #1B7A3D; font-weight: 600">26 online</span> · <span style="color: #B42318; font-weight: 600">1 offline</span></div>
  </div>

  <div style="max-width: 1400px; margin: 0 auto; padding: 16px 24px 0; display: flex; flex-direction: column; gap: 16px">
    <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 12px">
      <div style="display: flex; flex-wrap: wrap; gap: 8px; flex-grow: 1">
        <button type="button" style="min-height: 44px; padding: 0 16px; border-radius: 22px; border: 1px solid #1F5FBF; background: #1F5FBF; color: #FFFFFF; font: 600 14px Inter, sans-serif">Semua · 27</button>
        <button type="button" style="min-height: 44px; padding: 0 16px; border-radius: 22px; border: 1px solid #C5CCD5; background: #FFFFFF; color: #18212B; font: 500 14px Inter, sans-serif">Cutting · 4</button>
        <button type="button" style="min-height: 44px; padding: 0 16px; border-radius: 22px; border: 1px solid #C5CCD5; background: #FFFFFF; color: #18212B; font: 500 14px Inter, sans-serif">Sewing · 9</button>
        <button type="button" style="min-height: 44px; padding: 0 16px; border-radius: 22px; border: 1px solid #C5CCD5; background: #FFFFFF; color: #18212B; font: 500 14px Inter, sans-serif">Gudang · 5</button>
        <button type="button" style="min-height: 44px; padding: 0 16px; border-radius: 22px; border: 1px solid #C5CCD5; background: #FFFFFF; color: #18212B; font: 500 14px Inter, sans-serif">Packing · 3</button>
        <button type="button" style="min-height: 44px; padding: 0 16px; border-radius: 22px; border: 1px solid #C5CCD5; background: #FFFFFF; color: #18212B; font: 500 14px Inter, sans-serif">Gerbang &amp; luar · 6</button>
      </div>
      <div style="display: flex; align-items: center; gap: 8px">
        <label for="tata" style="font-size: 13px; color: #55606C">Tampilan</label>
        <select id="tata" style="min-height: 44px; padding: 0 12px; border-radius: 8px; border: 1px solid #C5CCD5; background: #FFFFFF; color: #18212B; font: 500 14px Inter, sans-serif">
          <option>4 × 3 (12 kamera)</option>
          <option>3 × 3 (9 kamera)</option>
          <option>2 × 2 (4 kamera)</option>
        </select>
      </div>
    </div>

    <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px">
      <sc-for list="{{cams}}" as="cam" hint-placeholder-count="12">
        <div style="background: #FFFFFF; border: 1px solid #DDE2E8; border-radius: 10px; overflow: hidden; display: flex; flex-direction: column">
          <div style="position: relative; aspect-ratio: 16 / 9; background: #11161C; display: flex; align-items: center; justify-content: center">
            <sc-if value="{{cam.on}}" hint-placeholder-val="{{true}}">
              <svg aria-hidden="true" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#3A4654" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M23 7l-7 5 7 5V7z"></path><rect x="1" y="5" width="15" height="14" rx="2"></rect></svg>
              <div style="position: absolute; left: 8px; top: 8px; display: flex; align-items: center; gap: 6px; background: #000000; color: #FFFFFF; font-size: 11px; font-weight: 600; padding: 3px 8px; border-radius: 4px"><span style="width: 7px; height: 7px; border-radius: 50%; background: #F04438"></span>LIVE</div>
            </sc-if>
            <sc-if value="{{cam.off}}" hint-placeholder-val="{{false}}">
              <div style="color: #C9D2DC; font-size: 13px; text-align: center; padding: 0 12px">Tidak ada sinyal<br>terakhir online 13:05</div>
            </sc-if>
            <div style="position: absolute; right: 8px; bottom: 8px; color: #C9D2DC; font-size: 11px">{{cam.path}}</div>
          </div>
          <div style="display: flex; align-items: center; gap: 8px; padding: 6px 6px 6px 12px">
            <div style="flex-grow: 1; min-width: 0">
              <div style="font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{cam.name}}</div>
              <div style="font-size: 12px; color: #55606C">{{cam.area}}</div>
            </div>
            <a href="Playback.dc.html" aria-label="Putar ulang rekaman" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border-radius: 8px; color: #1F5FBF">
              <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 4v6h6"></path><path d="M3.5 15a9 9 0 1 0 2.1-9.4L1 10"></path><path d="M12 7v5l3 2"></path></svg>
            </a>
          </div>
        </div>
      </sc-for>
    </div>

    <div style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px">
      <div style="font-size: 13px; color: #55606C">Menampilkan 1–12 dari 27 kamera. Klik gambar untuk layar penuh.</div>
      <div style="display: flex; align-items: center; gap: 8px">
        <button type="button" disabled style="min-height: 44px; padding: 0 16px; border-radius: 8px; border: 1px solid #DDE2E8; background: #EEF1F4; color: #6B7682; font: 500 14px Inter, sans-serif">Sebelumnya</button>
        <span style="font-size: 14px; font-weight: 600">1 / 3</span>
        <button type="button" style="min-height: 44px; padding: 0 16px; border-radius: 8px; border: 1px solid #C5CCD5; background: #FFFFFF; color: #18212B; font: 500 14px Inter, sans-serif">Berikutnya</button>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":900}}'>
class Component extends DCLogic {
renderVals() {
var rows = [
['Meja cutting 1','Cutting','cam8_60'],['Meja cutting 2','Cutting','cam8_61'],['Stok bundle','Cutting','cam8_62'],['Bundling','Cutting','cam8_63'],
['Sewing line 1','Sewing','cam8_64'],['Sewing line 2','Sewing','cam8_65'],['Sewing line 3','Sewing','cam8_66'],['Sewing line 4','Sewing','cam8_67'],
['QC','Sewing','cam8_68'],['Gudang kain','Gudang','cam8_69'],['Gudang benang','Gudang','cam8_70'],['Gerbang depan','Gerbang & luar','cam8_83']
];
return { cams: rows.map(function (r, i) { var off = i === 10; return { name: r[0], area: r[1], path: r[2], on: !off, off: off }; }) };
}
}
</script>
</body>
</html>
